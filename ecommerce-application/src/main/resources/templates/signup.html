<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Signup | MyShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Create Account
                </h2>

                <!-- Error Message -->
                <div th:if="${param.error}"
                     class="alert alert-danger">

                    Email already exists!

                </div>

                <!-- Signup Form -->
                <form th:action="@{/signup}"
                      method="post">

                    <!-- Name -->
                    <div class="mb-3">

                        <label>Name</label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               required>

                    </div>

                    <!-- Email -->
                    <div class="mb-3">

                        <label>Email</label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               required>

                    </div>

                    <!-- Password -->
                    <div class="mb-3">

                        <label>Password</label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               required>

                    </div>

                    <!-- Button -->
                    <button type="submit"
                            class="btn btn-primary w-100">

                        Sign Up

                    </button>

                </form>

                <!-- Login Link -->
                <div class="text-center mt-3">

                    <a href="/login">
                        Already have an account? Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
