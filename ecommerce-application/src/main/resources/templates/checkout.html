<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout | MyShop 🛍️</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f8;
        }
        .card {
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            border: none;
        }
        .summary-table th, .summary-table td {
            vertical-align: middle;
        }
        .total {
            font-weight: bold;
            font-size: 1.2rem;
            color: #007bff;
        }
    </style>
</head>
<body>

<!-- 🧭 Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">MyShop 🛍️</a>
        <div class="ms-auto">
            <a class="btn btn-outline-light" href="/cart">← Back to Cart</a>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="row">
        <!-- 🧍‍♂️ Customer Details -->
        <div class="col-md-6">
            <div class="card p-4">
                <h4>Customer Details</h4>
                <form id="checkoutForm" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required />
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required />
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Shipping Address</label>
                        <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">💳 Simulate Payment</button>
                </form>
            </div>
        </div>

        <!-- 🧾 Order Summary -->
        <div class="col-md-6">
            <div class="card p-4">
                <h4>Order Summary</h4>
                <table class="table summary-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th class="text-center">Qty</th>
                            <th class="text-end">Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td th:text="${item.productName}">Product Name</td>
                            <td class="text-center" th:text="${item.quantity}">1</td>
                            <td class="text-end">₹ <span th:text="${item.price * item.quantity}">0.0</span></td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="2" class="text-end">Total:</td>
                            <td class="text-end total">₹ <span th:text="${#numbers.formatDecimal(totalPrice, 1, 2)}">0.00</span></td>
                            
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- ✅ JavaScript to handle checkout form submission -->
<script>
document.getElementById("checkoutForm").addEventListener("submit", async function (e) {
    e.preventDefault(); // Prevent default form submit

    const form = e.target;
    const formData = new FormData(form);

    try {
        const response = await fetch("/api/checkout", {
            method: "POST",
            body: formData
        });

        const result = await response.json();

        if (result.status === "success") {
            alert("✅ " + result.message);
            window.location.href = "/catalog"; // Redirect to home page
        } else {
            alert("❌ " + result.message);
        }

    } catch (error) {
        console.error("Error during checkout:", error);
        alert("Something went wrong. Please try again later.");
    }
});
</script>

</body>
</html>
