<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Cart</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <h1>Your Shopping Cart</h1>

    <div th:if="${#lists.isEmpty(cartItems)}">
        <p>Your cart is empty.</p>
    </div>

    <div th:unless="${#lists.isEmpty(cartItems)}">
        <table border="1">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price (each)</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${cartItems}">
                    <td th:text="${item.productName}">Product</td>
                    <td th:text="${item.quantity}">1</td>
                    <td th:text="${item.price}">100.00</td>
                    <td th:text="${item.quantity * item.price}">100.00</td>
                    <td>
                        <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post">
                            <button type="submit">Remove</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <h3>Total: ₹<span th:text="${total}">0</span></h3>

        <form th:action="@{/cart/clear}" method="post">
            <button type="submit">Clear Cart</button>
        </form>

        <a href="/checkout"><button>Proceed to Checkout</button></a>
    </div>
</body>
</html>
