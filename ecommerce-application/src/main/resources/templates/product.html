<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Products | MyShop 🛍</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            border-radius: 10px;
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: scale(1.02);
        }
        .card-img-top {
            height: 200px;
            object-fit: contain;
            background-color: #fff;
        }
        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- 🧭 Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">MyShop 🛍</a>
        <div class="d-flex">
            <a class="btn btn-outline-light me-2" href="/cart">🛒 View Cart</a>
            <a class="btn btn-outline-light" href="/catalog">📦 Catalog</a>
        </div>
    </div>
</nav>

<!-- 📦 Products Grid -->
<div class="container py-5">
    <h2 class="mb-4 text-center">All Products</h2>
    <div class="row g-4">
        <div class="col-md-4" th:each="product : ${products}">
            <div class="card shadow-sm h-100">
                <img th:src="${product.imageUrl}" class="product-image" alt="Product Image"/>
                
                <div class="card-body d-flex flex-column justify-content-between">
                    <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                    <p class="card-text text-muted mb-2">₹ <span th:text="${product.price}">0.0</span></p>
                   <form th:action="@{/cart/add/{id}(id=${product.id})}" method="get" class="d-flex justify-content-between align-items-center">
    <button type="submit" class="btn btn-sm btn-success">Add to Cart</button>
</form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 📍 Footer -->
<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">© 2025 MyShop. All rights reserved.</p>
</footer>

</body>
</html>
